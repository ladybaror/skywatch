apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
spec:
  type: {{ .Values.service.type | default "NodePort" }}
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: {{ .Values.service.nodePort | default 30000 }}
      name: http
  selector:
    app: skywatch-frontend