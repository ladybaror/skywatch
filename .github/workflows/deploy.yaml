name: SkyWatch CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  lint-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Helm Verification
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint Helm Chart
        run: helm lint ./helm/skywatch

      # 2. Docker Setup
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build & Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./app/frontend/Dockerfile  # Adjust if your Dockerfile is in a subdirectory
          
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/skywatch-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/skywatch-frontend:${{ github.sha }}
      - name: Update Helm Image Tag in Git
        run: |
          # 1. עדכון ה-Tag בקובץ ה-values
          sed -i 's/tag: .*/tag: "${{ github.sha }}"/' helm/skywatch/values.yaml
          
          # 2. דחיפת השינוי חזרה ל-Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/skywatch/values.yaml
          git commit -m "chore(ci): update image tag to ${{ github.sha }} [skip ci]"
          git push origin main
